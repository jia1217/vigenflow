name: Vigenflow Ubuntu Worker Build In Docker

on:
  push:
    paths:
      - "src/models/**"
      - "src/lib/**"
      - "Dockerfile"
      - ".github/workflows/ubuntu-build.yml"
  pull_request:
    paths:
      - "src/models/**"
      - "src/lib/**"
      - "Dockerfile"
      - ".github/workflows/ubuntu-build.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  IMAGE_BASENAME: vigenflow-build-env
  IMAGE_TAG: ubuntu24.04
  SRC_DIR: src

jobs:
  build:
    name: Build worker run.exe files in GHCR image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner}/${IMAGE_BASENAME}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull or build image
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.name }}"
          if docker pull "$image"; then
            echo "Using GHCR build image: $image"
          else
            echo "GHCR build image is not available yet. Building it locally for this run."
            docker build \
              --build-arg BASE_IMAGE=ubuntu:24.04 \
              --build-arg UBUNTU_PPA=ppa:lemonade-team/stable \
              --build-arg INSTALL_XRT_DEV=1 \
              -t "$image" \
              .
          fi

      - name: Build run.exe files in container
        run: |
          docker run --rm \
            -e HOME=/tmp \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            --user "$(id -u):$(id -g)" \
            "${{ steps.image.outputs.name }}" \
            bash -lc '
              set -euo pipefail
              make -C src/models/z-image-turbo-npu/bf16_lora clean all
              make -C src/models/z-image-turbo-npu/q41 clean all
              make -C src/models/z-image-turbo-npu/q41_lora_fused clean all
              make -C src/models/flux.2-klein-4B-npu clean all
              make -C src/models/flux.2-klein-4B-edit-npu clean all
              count="$(find src/exe_models -type f -name run.exe | wc -l)"
              if [ "$count" -ne 5 ]; then
                echo "Expected 5 run.exe files, found $count"
                find src/exe_models -type f -name run.exe -print
                exit 1
              fi
              find src/exe_models -type f -name run.exe -exec chmod +x {} \; -print
            '

      - name: Stage artifact
        run: |
          set -euo pipefail
          out="dist/ubuntu-exe"
          rm -rf "$out"
          mkdir -p "$out/exe_models" "$out/lib"

          find "${SRC_DIR}/exe_models" -type f -name run.exe -print0 | while IFS= read -r -d '' exe; do
            rel="${exe#${SRC_DIR}/exe_models/}"
            mkdir -p "$out/exe_models/$(dirname "$rel")"
            cp "$exe" "$out/exe_models/$rel"
          done

          cp "${SRC_DIR}/lib"/*.so "$out/lib/"
          find "$out" -type f -print

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vigenflow-ubuntu-run-exe
          path: dist/ubuntu-exe
          if-no-files-found: error
