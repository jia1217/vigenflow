name: Vigenflow Ubuntu Build In Docker

on:
  push:
    paths:
      - "src/server_unified/**"
      - ".github/workflows/ubuntu-build.yml"
  pull_request:
    paths:
      - "src/server_unified/**"
      - ".github/workflows/ubuntu-build.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  IMAGE_BASENAME: vigenflow-build-env
  IMAGE_TAG: ubuntu24.04
  SERVER_DIR: src/server_unified

jobs:
  build:
    name: Build server in GHCR image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner}/${IMAGE_BASENAME}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull build image
        run: docker pull "${{ steps.image.outputs.name }}"

      - name: Build in container
        run: |
          docker run --rm \
            -e HOME=/tmp \
            -e SERVER_DIR="${SERVER_DIR}" \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            --user "$(id -u):$(id -g)" \
            "${{ steps.image.outputs.name }}" \
            bash -lc 'cd "$SERVER_DIR" && bash build_ubuntu.sh && ./vigenflow_ubuntu/vgf-serve --help'

      - name: Stage artifact
        run: |
          mkdir -p dist/ubuntu
          cp "${SERVER_DIR}/vigenflow_ubuntu/vgf-serve" dist/ubuntu/
          cp "${SERVER_DIR}"/*.jsonc dist/ubuntu/
          cp "${SERVER_DIR}/README.md" dist/ubuntu/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vgf-serve-ubuntu-x64
          path: dist/ubuntu
          if-no-files-found: error
