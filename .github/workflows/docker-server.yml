name: Vigenflow Server Docker Image

# Builds docker/Dockerfile, the image users run (docs/docker.md). A v* tag or a manual run pushes it
# to ghcr.io/<owner>/vigenflow; pull requests only build it. latest, which docker/install.sh pulls,
# follows v* tags and manual runs on the default branch.

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "docker/**"
      - "src/exe_models/**"
      - "src/lib/**"
      - "src/models/**"
      - "src/npu_files/**"
      - "src/prepare_weights/**"
      - "src/server_unified/**"
      - ".dockerignore"
      - ".github/workflows/docker-server.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_BASENAME: vigenflow

jobs:
  build-and-push:
    name: Build GHCR image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check installer model selection
        run: python3 docker/tests/test_install.py -v

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner}/${IMAGE_BASENAME}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for validation
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: vigenflow:ci-check
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=vigenflow-server
          cache-to: type=gha,mode=max,scope=vigenflow-server

      - name: Check packaged image without NPU inference
        run: python3 docker/tests/check_image.py vigenflow:ci-check

      - name: Push validated image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=vigenflow-server
          cache-to: type=gha,mode=max,scope=vigenflow-server
