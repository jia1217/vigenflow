name: Vigenflow Server Build

on:
  push:
    paths:
      - "src/server_unified/**"
      - "src/prepare_weights/**"
      - ".github/workflows/server-build.yml"
  pull_request:
    paths:
      - "src/server_unified/**"
      - "src/prepare_weights/**"
      - ".github/workflows/server-build.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SERVER_DIR: src/server_unified
  PREPARE_DIR: src/prepare_weights

jobs:
  build-ubuntu:
    name: Ubuntu build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++-13 libboost-all-dev nlohmann-json3-dev libpng-dev libstb-dev

      - name: Build
        working-directory: ${{ env.SERVER_DIR }}
        run: bash build_ubuntu.sh

      - name: Build prepare_base.exe
        working-directory: ${{ env.PREPARE_DIR }}
        run: bash build_ubuntu.sh

      - name: Smoke test
        run: |
          ./${{ env.SERVER_DIR }}/vigenflow_ubuntu/vgf-serve --help
          ./${{ env.PREPARE_DIR }}/prepare_base.exe --help

      - name: Stage artifact
        run: |
          mkdir -p dist/ubuntu/server_running dist/ubuntu/prepare
          cp "${SERVER_DIR}/vigenflow_ubuntu/vgf-serve" "${SERVER_DIR}/README.md" dist/ubuntu/server_running/
          cp "${PREPARE_DIR}/prepare_base.exe" "${PREPARE_DIR}/prepare_models.jsonc" "${PREPARE_DIR}/README.md" dist/ubuntu/prepare/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vgf-serve-ubuntu-x64
          path: dist/ubuntu
          if-no-files-found: error

  build-windows:
    name: Windows build
    runs-on: windows-latest

    env:
      VCPKG_TRIPLET: x64-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot -or -not (Test-Path "$vcpkgRoot\vcpkg.exe")) {
            if (Test-Path "C:\vcpkg\vcpkg.exe") {
              $vcpkgRoot = "C:\vcpkg"
            } else {
              $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg"
              git clone https://github.com/microsoft/vcpkg "$vcpkgRoot"
              & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
            }
          }

          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKG_TRIPLET=$env:VCPKG_TRIPLET" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            boost-asio:$env:VCPKG_TRIPLET `
            boost-beast:$env:VCPKG_TRIPLET `
            boost-filesystem:$env:VCPKG_TRIPLET `
            boost-gil:$env:VCPKG_TRIPLET `
            boost-process:$env:VCPKG_TRIPLET `
            boost-system:$env:VCPKG_TRIPLET `
            libpng:$env:VCPKG_TRIPLET `
            nlohmann-json:$env:VCPKG_TRIPLET `
            stb:$env:VCPKG_TRIPLET

      - name: Build
        working-directory: ${{ env.SERVER_DIR }}
        shell: cmd
        run: build_windows.bat

      - name: Build prepare_base.exe
        working-directory: ${{ env.PREPARE_DIR }}
        shell: cmd
        run: build_windows.bat

      - name: Smoke test
        shell: pwsh
        run: |
          # The DLLs build_windows.bat copied; 0xC0000135 below means one that vgf-serve.exe needs is missing.
          Get-ChildItem "$env:SERVER_DIR\vigenflow_win" -Filter *.dll | ForEach-Object { "  $($_.Name)" }
          foreach ($exe in "$env:SERVER_DIR\vigenflow_win\vgf-serve.exe", "$env:PREPARE_DIR\vigenflow_win\prepare_base.exe") {
            & $exe --help
            if ($LASTEXITCODE -ne 0) { throw ("{0} --help exited with 0x{1:X8}" -f $exe, $LASTEXITCODE) }
          }

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist\windows\server_running, dist\windows\prepare -Force | Out-Null
          Copy-Item "$env:SERVER_DIR\vigenflow_win\vgf-serve.exe" dist\windows\server_running\
          Copy-Item "$env:SERVER_DIR\vigenflow_win\*.dll" dist\windows\server_running\ -ErrorAction SilentlyContinue
          Copy-Item "$env:SERVER_DIR\README.md" dist\windows\server_running\
          Copy-Item "$env:PREPARE_DIR\vigenflow_win\prepare_base.exe", "$env:PREPARE_DIR\prepare_models.jsonc", "$env:PREPARE_DIR\README.md" dist\windows\prepare\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vgf-serve-windows-x64
          path: dist/windows
          if-no-files-found: error
